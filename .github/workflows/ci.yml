name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  JAVA_VERSION: 17

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript type check
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Expo dependency check
        # Not advisory: an SDK version outside what Expo pins means the native
        # build below is testing something other than what is committed.
        run: bun run check:install

  build-debug:
    runs-on: ubuntu-latest
    needs: typecheck-lint
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Named rather than inherited, because inheriting is what broke this.
          #
          # v3 defaulted to `tools platform-tools`, and `tools` was withdrawn from
          # the SDK repository years ago. `sdkmanager tools` exited 1, which failed
          # the step -- so the job died before compiling a single line of app code,
          # and the log's last 200 lines were six licence agreements rather than
          # anything about this project. v4's default is `platform-tools` alone, but
          # pinning the list means the next action default cannot break the build the
          # same silent way.
          packages: platform-tools

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build terminal shell asset
        run: bun run build:terminal-shell

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          # A build that produced no APK is a failure, not a warning. With
          # `warn` this step passes while silently uploading nothing.
          if-no-files-found: error
