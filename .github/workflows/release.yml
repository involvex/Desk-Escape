name: Release

on:
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "22"
  JAVA_VERSION: 17

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build terminal shell asset
        run: bun run build:terminal-shell

      - name: Decode keystore and write signing config
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat >> android/gradle.properties << EOF

          # Release signing configuration (set by CI)
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "Signing with production release keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK (universal)
        working-directory: android
        run: ./gradlew assembleRelease -Pandroid.injected.invoked.from.ide=true

      - name: Locate release APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "app-release*.apk" -o -name "app-arm64-v8a-release.apk" -o -name "app-x86_64-release.apk" | head -1)
          # Prefer a universal APK if it exists (assembleRelease builds per-ABI)
          UNIVERSAL_APK=$(find android/app/build/outputs/apk -name "*-universal-release.apk" | head -1)
          if [ -n "$UNIVERSAL_APK" ]; then
            APK_PATH=$UNIVERSAL_APK
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Selected APK: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            find android/app/build/outputs/apk -type f -name "*.apk"
            exit 1
          fi

      - name: Copy APK to repo root
        run: |
          cp "$APK_PATH" app-release.apk
          echo "File size:"; ls -lh app-release.apk

      # Tag name minus v prefix gives us the version (e.g. v1.1.0 -> 1.1.0)
      - name: Extract version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app-release.apk
          tag_name: ${{ github.ref_name }}
          name: ${{ env.VERSION }}
